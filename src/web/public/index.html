<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company Research</title>
<script src="/vendor/chart.umd.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #5d6677; --line: #e3e6eb;
    --accent: #2457c5; --good: #1a7f4b; --bad: #b42318; --warn: #9a6700;
    --rep: #e8f0fe; --calc: #eef7ee; --est: #fff4e0; --na: #f1f1f1; --interp: #f3ecff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1a1f27; --text: #e6e9ef; --muted: #9aa3b2; --line: #2c3340;
      --accent: #7ea6ff; --good: #5cc98d; --bad: #ff8a80; --warn: #e3b341;
      --rep: #1f2d4a; --calc: #1d3326; --est: #3a2f1a; --na: #2a2f38; --interp: #2e2645;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--card); border-bottom: 1px solid var(--line); padding: 14px 16px; position: sticky; top: 0; z-index: 2; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  form h1 { font-size: 17px; margin: 0 12px 0 0; }
  input[type=text] { padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font-size: 15px; }
  #symbol { width: 160px; text-transform: uppercase; }
  #peers { width: 240px; text-transform: uppercase; }
  input::placeholder { text-transform: none; }
  button { padding: 8px 16px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  label.small { font-size: 13px; color: var(--muted); }
  main { padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-bottom: 14px; overflow-x: auto; }
  h2 { font-size: 18px; margin: 0 0 10px; }
  h3 { font-size: 15px; margin: 16px 0 6px; }
  .muted { color: var(--muted); font-size: 13px; }
  .status { margin-top: 10px; font-size: 14px; color: var(--muted); }
  .error { color: var(--bad); }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px; white-space: nowrap; }
  .b-reported { background: var(--rep); } .b-calculated { background: var(--calc); } .b-estimate { background: var(--est); }
  .b-unavailable { background: var(--na); color: var(--muted); } .b-interp { background: var(--interp); }
  .pos { color: var(--good); } .neg { color: var(--bad); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  .chart { position: relative; height: 260px; }
  .warn { border-left: 3px solid var(--warn); padding: 6px 10px; background: var(--bg); margin: 6px 0; font-size: 14px; }
  ul { margin: 4px 0; padding-left: 20px; }
  li { margin: 3px 0; }
  .price { font-size: 26px; font-weight: 700; }
  a { color: var(--accent); }
  @media (max-width: 600px) { #symbol, #peers { width: 100%; } }
</style>
</head>
<body>
<header>
  <form id="f" class="wrap">
    <h1>Company Research</h1>
    <input id="symbol" type="text" placeholder="NSE symbol, e.g. HIKAL" autocomplete="off" required>
    <input id="peers" type="text" placeholder="Peers (optional): A,B,C" autocomplete="off">
    <label class="small"><input id="refresh" type="checkbox"> fetch fresh</label>
    <button id="go" type="submit">Analyze</button>
  </form>
  <div class="wrap status" id="status">Enter an NSE symbol and click Analyze. Research only: this page cannot place orders.</div>
</header>
<main class="wrap" id="out"></main>

<script src="/research.js"></script>
<script src="/dashboard.js"></script>
</body>
</html>
